<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<title>风之律动</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="portrait">

  <div id="screen-wrap">
    <canvas id="cv" width="640" height="480"></canvas>
    <!-- 跳过动画提示 -->
    <div id="skip-hint" class="hidden">连按 START 跳过过场动画</div>
  </div>

  <nav id="menubar">
    <button class="mbtn" id="btn-menu">☰</button>
    <button class="mbtn" id="btn-skip" style="font-size:12px">跳过动画 ▶▶</button>
    <span id="fps-tag">-- FPS</span>
    <button class="mbtn" id="btn-flip" title="反转视角">⟳</button>
    <button class="mbtn" id="btn-wide" title="宽屏">▭</button>
    <button class="mbtn" id="btn-full">⛶</button>
  </nav>

  <div id="menu" class="hidden">
    <div class="card">
      <h3>游戏</h3>
      <div class="row">
        <button id="m-load">载入镜像</button>
        <input type="file" id="m-file" accept=".iso,.gcm" hidden>
        <button id="m-reset" class="g">重置</button>
      </div>
    </div>
    <div class="card">
      <h3>显示 <span id="disp-info" class="tag"></span></h3>
      <div class="row"><span class="tag">分辨率</span></div>
      <div class="row">
        <button class="g sm" data-res="480p">480P</button>
        <button class="g sm" data-res="720p">720P</button>
        <button class="g sm" data-res="1080p">1K</button>
        <button class="g sm" data-res="1440p">2K</button>
        <button class="g sm" data-res="2160p">4K</button>
      </div>
      <div class="row"><span class="tag">画面比例</span></div>
      <div class="row">
        <button class="g sm" data-aspect="4:3">4:3</button>
        <button class="g sm" data-aspect="16:9">16:9 宽屏</button>
        <button class="g sm" data-aspect="fill">拉伸铺满</button>
      </div>
      <div class="row"><span class="tag">物理帧率（30~120，改变物理步长）</span></div>
      <div class="row" id="phys-fps-row">
        <input type="range" id="phys-fps" min="30" max="120" step="1" value="60" style="flex:1">
        <span id="phys-fps-val" class="tag">60 Hz</span>
      </div>
      <div class="row">
        <button class="g sm" data-phys="30">30</button>
        <button class="g sm" data-phys="45">45</button>
        <button class="g sm" data-phys="60">60</button>
        <button class="g sm" data-phys="90">90</button>
        <button class="g sm" data-phys="120">120</button>
      </div>
      <div class="row"><span class="tag">渲染帧率上限</span></div>
      <div class="row">
        <button class="g sm" data-fps="30">30</button>
        <button class="g sm" data-fps="60">60</button>
        <button class="g sm" data-fps="120">120</button>
        <button class="g sm" data-fps="144">144</button>
        <button class="g sm" data-fps="0">不限</button>
      </div>
    </div>
    <div class="card">
      <h3>视角</h3>
      <div class="row">
        <button id="m-flip">左右反转视角</button>
        <span class="tag">风之律动指挥棒不受影响</span>
      </div>
    </div>
    <div class="card">
      <h3>金手指</h3>
      <div id="cheat-list"></div>
      <div class="row">
        <button id="cheat-add">+ 自定义</button>
        <button id="cheat-import" class="g">导入 .ini</button>
        <input type="file" id="cheat-file" accept=".ini,.txt" hidden>
      </div>
    </div>
    <div class="card">
      <h3>存档</h3>
      <div class="row">
        <button class="g slot" data-slot="0">槽1</button>
        <button class="g slot" data-slot="1">槽2</button>
        <button class="g slot" data-slot="2">槽3</button>
        <button id="gci-exp">导出 .gci</button>
        <button id="gci-imp">导入 .gci</button>
        <input type="file" id="gci-file" accept=".gci" hidden>
      </div>
    </div>
    <div class="card">
      <h3>设置</h3>
      <div class="row">
        <button id="m-orient" class="g">横屏/竖屏</button>
        <span class="tag">性能模式</span>
        <input type="checkbox" id="m-perf">
      </div>
    </div>
    <div class="card">
      <h3>日志</h3>
      <div id="log"></div>
    </div>
  </div>

  <div id="pad">
    <div class="b trg-l" id="bl" data-btn="L">L</div>
    <div class="b trg-r" id="br" data-btn="R">R</div>
    <div class="b trg-z" id="bz" data-btn="Z">Z</div>
    <div class="st" id="s1"><div class="kn"></div></div>
    <div class="dp" data-dpad="UP" style="left:48px;bottom:206px">▲</div>
    <div class="dp" data-dpad="DOWN" style="left:48px;bottom:160px">▼</div>
    <div class="dp" data-dpad="LEFT" style="left:22px;bottom:183px">◀</div>
    <div class="dp" data-dpad="RIGHT" style="left:74px;bottom:183px">▶</div>
    <div class="st cs" id="s2"><div class="kn"></div></div>
    <div class="b" id="bs" data-btn="START" style="left:50%;margin-left:-19px;bottom:125px;width:44px;height:26px;border-radius:13px;font-size:10px">START</div>
    <div class="b face x" data-btn="X" style="right:72px;bottom:82px">X</div>
    <div class="b face y" data-btn="Y" style="right:106px;bottom:48px">Y</div>
    <div class="b face a" data-btn="A" style="right:38px;bottom:48px">A</div>
    <div class="b face b" data-btn="B" style="right:72px;bottom:14px">B</div>
  </div>

  <div id="splash">
    <h1>风之律动</h1>
    <p>The Wind Waker</p>
    <div id="load-status">初始化…</div>
    <button id="start-btn" class="hidden">开始游戏</button>
  </div>
</div>
<script src="input.js"></script>
<script src="cheats.js"></script>
<script src="gci.js"></script>
<script src="display.js"></script>
<script src="text.js"></script>
<script src="gx2gl.js"></script>
<script src="main.js"></script>
</body>
</html>
